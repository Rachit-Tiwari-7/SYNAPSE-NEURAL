version: '3.8'

# ==============================================================================
# Production Docker Compose Override (Security Gating & Resource Limits)
# ==============================================================================

services:
  frontend:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  backend:
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M

  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-synapse_secure_cache_2026}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
