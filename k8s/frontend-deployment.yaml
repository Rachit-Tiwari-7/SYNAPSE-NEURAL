apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapseos-frontend
  namespace: synapseos-system
  labels:
    app: synapseos-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: synapseos-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: synapseos-frontend
    spec:
      containers:
        - name: frontend
          image: synapseos/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: synapseos-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: synapseos-frontend
  namespace: synapseos-system
spec:
  type: ClusterIP
  selector:
    app: synapseos-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http
