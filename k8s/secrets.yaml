apiVersion: v1
kind: Secret
metadata:
  name: synapseos-secrets
  namespace: synapseos-system
type: Opaque
stringData:
  GEMINI_API_KEY: "replace_with_production_gemini_key"
  GROQ_API_KEY: "replace_with_production_groq_key"
  VAPI_API_KEY: "replace_with_production_vapi_key"
  VAPI_ASSISTANT_ID: "replace_with_vapi_assistant_id"
  WHATSAPP_TOKEN: "replace_with_meta_whatsapp_token"
  REDIS_PASSWORD: "replace_with_secure_redis_password"
