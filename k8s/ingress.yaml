apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapseos-ingress
  namespace: synapseos-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.synapseos.health
        - api.synapseos.health
      secretName: synapseos-tls-cert
  rules:
    - host: app.synapseos.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapseos-frontend
                port:
                  number: 3000
    - host: api.synapseos.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapseos-backend
                port:
                  number: 8000
