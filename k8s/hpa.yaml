apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synapseos-backend-hpa
  namespace: synapseos-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synapseos-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synapseos-frontend-hpa
  namespace: synapseos-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synapseos-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
