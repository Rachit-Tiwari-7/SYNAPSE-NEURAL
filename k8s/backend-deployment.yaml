apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapseos-backend
  namespace: synapseos-system
  labels:
    app: synapseos-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: synapseos-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: synapseos-backend
    spec:
      containers:
        - name: backend
          image: synapseos/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: synapseos-config
            - secretRef:
                name: synapseos-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "4096Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: synapseos-backend
  namespace: synapseos-system
spec:
  type: ClusterIP
  selector:
    app: synapseos-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      name: http
